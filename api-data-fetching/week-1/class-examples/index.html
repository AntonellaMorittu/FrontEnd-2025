<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Fetching</title>
    <style>
      /* Reset default margins and paddings */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #e4ceef, #c6f7f2);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        color: #070027;
      }

      .container {
        background-color: rgba(255, 255, 255, 0.9);
        padding: 40px 60px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 90%;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 20px;
        color: #4b0082;
      }

      #activity {
        font-size: 1.2rem;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>API Fetching</h1>
      <p id="activity">Loading...</p>
    </div>
    <script type="module" src="./api-fetching.js" defer></script>
  </body>
</html>
